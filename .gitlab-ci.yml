# Mew-line CI: The Furry Pipeline for GitLab
#
# Pipeline overview:
#   lint    - bun install + typecheck (soft-fail)
#   build   - bun install + nuxt build (artifacts)
#   deploy  - SSHes into the production server and runs scripts/deploy.sh
#
# Required CI/CD variables (Settings > CI/CD > Variables):
#   SSH_DEPLOY_PASSWORD - root password for the production server
#                         Type: Variable. Mask + Protect. Do not wrap in quotes.
#   SSH_DEPLOY_HOST     - Hostname or IP of the production server
#   SSH_DEPLOY_USER     - (optional) SSH username, defaults to root
#   SSH_DEPLOY_PORT     - (optional) SSH port, defaults to 22
#
# The server must allow password login for that user:
#   PasswordAuthentication yes
#   PermitRootLogin yes
#
# To set up the server:
#   1. Confirm root (or SSH_DEPLOY_USER) can SSH with a password
#   2. Place a working .env file at $DEPLOY_PATH/.env on the server with
#      NUXT_APP_PASSWORD, NUXT_SESSION_SECRET, and NUXT_OPENROUTER_API_KEY
#   3. Ensure Docker and docker compose are installed and the deploy user
#      can run them without sudo (or adjust the script accordingly)

image: oven/bun:latest

stages:
  - lint
  - build
  - deploy

# Paws-ing for a lint
lint_code:
  stage: lint
  script:
    - bun install
    - bun run typecheck || echo "Keep it purring, type-checking is paws-itive but optional for now"
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_COMMIT_BRANCH == 'main'

# The Big Scratch: Building the App
build_app:
  stage: build
  script:
    - bun install
    - bun run build
  artifacts:
    paths:
      - .output/
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_BRANCH == 'main'

# Purr-duction: Redeploys the production container on the live server
deploy_production:
  stage: deploy
  image: alpine:3.20
  before_script:
    - apk add --no-cache openssh-client bash sshpass
    - test -n "${SSH_DEPLOY_PASSWORD:-}" || { echo "SSH_DEPLOY_PASSWORD is empty"; exit 1; }
    - test -n "${SSH_DEPLOY_HOST:-}" || { echo "SSH_DEPLOY_HOST is empty"; exit 1; }
    - export SSHPASS="$SSH_DEPLOY_PASSWORD"
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - ssh-keyscan -p "${SSH_DEPLOY_PORT:-22}" "$SSH_DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null
  script:
    - sshpass -e scp -P "${SSH_DEPLOY_PORT:-22}" scripts/deploy.sh "${SSH_DEPLOY_USER:-root}@$SSH_DEPLOY_HOST:/tmp/meow-deploy.sh"
    - sshpass -e ssh -p "${SSH_DEPLOY_PORT:-22}" "${SSH_DEPLOY_USER:-root}@$SSH_DEPLOY_HOST" "bash /tmp/meow-deploy.sh"
  environment:
    name: production
    url: https://meow.yanawa.io
  rules:
    - if: $CI_COMMIT_BRANCH == 'main'
  needs:
    - build_app
