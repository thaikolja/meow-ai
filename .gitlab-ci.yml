# Meow CI
#
# Pipeline:
#   lint    - bun install + typecheck (soft-fail)
#   build   - bun install + bun run build (artifacts)
#   deploy  - push/merge to main → SSH key → hard-reset checkout → scripts/deploy.sh
#
# GitLab CI/CD variables (masked/protected as appropriate):
#   SSH_PRIVATE_KEY     private key that can log in as SSH_USER
#   SSH_HOST            production hostname
#   SSH_USER            remote user
#   REMOTE_SCRIPT_PATH  absolute path, normally
#                       /var/www/vhosts/yanawa.io/meow.yanawa.io/scripts/deploy.sh
#
# The SSH step hard-resets the host checkout to origin/main (keeps untracked
# .env) so a dirty tracked file cannot block the pull, then runs deploy.sh.
# The server .env must set NUXT_APP_PASSWORD, NUXT_OPENROUTER_API_KEY, and
# NUXT_DEEPSEEK_API_KEY. NUXT_SESSION_SECRET is optional.

image: oven/bun:latest

stages:
  - lint
  - build
  - deploy

variables:
  SSH_PRIVATE_KEY: $SSH_PRIVATE_KEY
  SSH_HOST: $SSH_HOST
  SSH_USER: $SSH_USER
  REMOTE_SCRIPT_PATH: $REMOTE_SCRIPT_PATH

lint_code:
  stage: lint
  script:
    - bun install
    - bun run typecheck || echo "Typecheck failed; continuing because this job is optional"
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_COMMIT_BRANCH == 'main'

build_app:
  stage: build
  script:
    - bun install
    - bun run build
  artifacts:
    paths:
      - .output/
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_BRANCH == 'main'

deploy:
  stage: deploy
  image: alpine:latest
  needs:
    - build_app
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  before_script:
    - apk add --no-cache openssh-client
    - test -n "$SSH_PRIVATE_KEY"
    - test -n "$SSH_HOST"
    - test -n "$SSH_USER"
    - test -n "$REMOTE_SCRIPT_PATH"
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - ssh-keyscan "$SSH_HOST" >> ~/.ssh/known_hosts
  script:
    - ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" "set -e; cd \"\$(dirname '$REMOTE_SCRIPT_PATH')\" && git fetch origin && git reset --hard origin/main && bash '$REMOTE_SCRIPT_PATH'"
  environment:
    name: production
    url: https://meow.yanawa.io
